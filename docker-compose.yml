version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: neomarket-b2c-db
    environment:
      POSTGRES_USER: neomarket
      POSTGRES_PASSWORD: neomarket_pass
      POSTGRES_DB: neomarket_b2c
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomarket -d neomarket_b2c"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: neomarket-b2c-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://neomarket:neomarket_pass@db:5432/neomarket_b2c
      B2B_API_URL: http://host.docker.internal:8001/api/v1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: