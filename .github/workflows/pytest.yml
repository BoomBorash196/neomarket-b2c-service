name: pytest

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neomarket
          POSTGRES_PASSWORD: neomarket
          POSTGRES_DB: neomarket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://neomarket:neomarket@localhost:5432/neomarket_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect test plan
        run: python -m pytest --collect-only -q

      - name: Run catalog and similar-product suites
        # These two suites assert the published B2B contract end to end:
        # request parameter names, response schemas and the 502 mapping for a
        # downed B2B. They run against mocked transport, so no services needed.
        run: python -m pytest tests/test_catalog.py tests/test_similar_products.py -v

      - name: Run full suite
        run: python -m pytest -v